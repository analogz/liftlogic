        // Progressive Overload System
        function getLastWorkoutForExercise(exerciseName) {
            try {
                const workoutsKey = currentUser === 'default' ? 'workouts' : `${currentUser}_workouts`;
                const workouts = JSON.parse(localStorage.getItem(workoutsKey) || '[]');

                if (!Array.isArray(workouts) || workouts.length === 0) {
                    return null;
                }

                // Sort by date descending (most recent first)
                const sortedWorkouts = workouts.sort((a, b) => {
                    const dateA = a.date || a.dailyInfo?.currentDate || '';
                    const dateB = b.date || b.dailyInfo?.currentDate || '';
                    return dateB.localeCompare(dateA);
                });

                // Find most recent workout containing this exercise
                // Normalize exercise names for flexible matching
                const normalizeExerciseName = (name) => {
                    if (!name || typeof name !== 'string') return '';
                    return name.toLowerCase()
                        .replace(/[-_]/g, ' ')  // Replace hyphens and underscores with spaces
                        .replace(/\s+/g, ' ')   // Normalize multiple spaces
                        .trim();
                };

                const normalizedSearchName = normalizeExerciseName(exerciseName);
                if (!normalizedSearchName) return null;

                for (const workout of sortedWorkouts) {
                    // Deleted rows and rides are not history for a suggestion.
                    if (!workout || workout.deleted === true || workout.type === 'ride' || !workout.exercises) continue;

                    const exercises = workout.exercises;
                    const match = exercises.find(ex => {
                        if (!ex || !ex.kind) return false;
                        // Same identity as the progress chart (aliases yes, substrings no).
                        if (typeof LiftLogicProgress !== 'undefined') {
                            return LiftLogicProgress.sameExercise(exerciseName, ex.kind);
                        }
                        const normalizedExName = normalizeExerciseName(ex.kind);
                        if (!normalizedExName) return false;
                        return normalizedExName === normalizedSearchName;
                    });

                    if (match) {
                        return {
                            date: workout.date || workout.dailyInfo?.currentDate || 'Unknown',
                            exercise: match
                        };
                    }
                }

                return null;
            } catch (e) {
                console.error('Error retrieving last workout:', e);
                return null;
            }
        }

        function suggestProgressiveOverload(lastWorkout) {
            if (!lastWorkout || !lastWorkout.exercise) return null;

            const sets = lastWorkout.exercise.sets || [];
            if (!Array.isArray(sets) || sets.length === 0) return null;

            // Filter out invalid sets
            const validSets = sets.filter(set =>
                set &&
                (parseFloat(set.weight) > 0 || parseInt(set.reps) > 0)
            );

            if (validSets.length === 0) return null;

            // Calculate average weight and reps from last workout
            const totalWeight = validSets.reduce((sum, set) => sum + (parseFloat(set.weight) || 0), 0);
            const totalReps = validSets.reduce((sum, set) => sum + (parseInt(set.reps) || 0), 0);

            const avgWeight = totalWeight / validSets.length;
            const avgReps = totalReps / validSets.length;

            // Validate averages
            if (isNaN(avgWeight) || isNaN(avgReps) || (avgWeight === 0 && avgReps === 0)) {
                return null;
            }

            // Progressive overload strategy: 2.5% weight increase OR 1-2 rep increase
            const suggestedWeight = avgWeight > 0 ? Math.round((avgWeight * 1.025) * 2) / 2 : 0; // Round to nearest 0.5
            const suggestedReps = avgReps > 0 ? Math.ceil(avgReps + 1) : 0;

            return {
                lastWeight: Math.round(avgWeight * 10) / 10, // Round to 1 decimal
                lastReps: Math.round(avgReps),
                suggestedWeight: suggestedWeight,
                suggestedReps: suggestedReps,
                sets: validSets
            };
        }

        // Debounce chart updates while a name is still being typed.
        const progressInputTimers = Object.create(null);

        function updateExerciseProgress(exerciseId, commit) {
            if (commit === false) {
                clearTimeout(progressInputTimers[exerciseId]);
                progressInputTimers[exerciseId] = setTimeout(() => {
                    renderExerciseProgress(exerciseId, false);
                }, 160);
                return;
            }
            clearTimeout(progressInputTimers[exerciseId]);
            renderExerciseProgress(exerciseId, true);
        }

        function renderExerciseProgress(exerciseId, commit) {
            const input = document.getElementById(`exercise-${exerciseId}`);
            const root = document.getElementById(`progress-${exerciseId}`);
            if (!input || !root || typeof LiftLogicProgress === 'undefined') return;

            const name = input.value.trim();
            if (!name) {
                LiftLogicProgress.clear(root);
                linkProgressDescription(exerciseId);
                return;
            }

            let history;
            try {
                history = LiftLogicProgress.buildHistory(name, { userId: currentUser });
            } catch (e) {
                console.error('Exercise progress failed', e);
                return;
            }

            const known = history.matchedWorkouts > 0 ||
                (typeof ExerciseDB !== 'undefined' && !!ExerciseDB.resolveName(name));
            if (!commit && !known) {
                LiftLogicProgress.clear(root);
                linkProgressDescription(exerciseId);
                return;
            }

            LiftLogicProgress.mount(root, history);
            const summary = root.querySelector('.progress-summary');
            if (summary) summary.id = `progress-summary-${exerciseId}`;
            linkProgressDescription(exerciseId);
        }

        function linkProgressDescription(exerciseId) {
            const input = document.getElementById(`exercise-${exerciseId}`);
            if (!input) return;
            const ids = [];
            const hint = document.getElementById(`hint-${exerciseId}`);
            if (hint && hint.style.display !== 'none' && hint.textContent.trim()) ids.push(hint.id);
            const summary = document.getElementById(`progress-summary-${exerciseId}`);
            if (summary && summary.textContent.trim()) ids.push(summary.id);
            if (ids.length) input.setAttribute('aria-describedby', ids.join(' '));
            else input.removeAttribute('aria-describedby');
        }

        function refreshVisibleExerciseProgress() {
            document.querySelectorAll('.exercise-entry').forEach(entry => {
                showProgressiveOverloadHint(entry.dataset.exerciseId);
            });
        }

        function showProgressiveOverloadHint(exerciseId) {
            const exerciseInput = document.getElementById(`exercise-${exerciseId}`);
            const hintDiv = document.getElementById(`hint-${exerciseId}`);

            if (!exerciseInput || !hintDiv) {
                console.error('Progressive overload elements not found for exercise', exerciseId);
                return;
            }

            clearTimeout(progressInputTimers[exerciseId]);

            function finishProgress() {
                try {
                    renderExerciseProgress(exerciseId, true);
                } catch (e) {
                    console.error('Exercise progress failed', e);
                }
                linkProgressDescription(exerciseId);
            }

            const exerciseName = exerciseInput.value.trim();

            if (!exerciseName) {
                hintDiv.style.display = 'none';
                finishProgress();
                return;
            }

            const lastWorkout = getLastWorkoutForExercise(exerciseName);

            if (!lastWorkout) {
                hintDiv.style.display = 'none';
                finishProgress();
                return;
            }

            const suggestion = suggestProgressiveOverload(lastWorkout);

            if (!suggestion) {
                hintDiv.style.display = 'none';
                finishProgress();
                return;
            }

            // Format date safely
            let formattedDate = 'Recent';
            try {
                if (lastWorkout.date && lastWorkout.date !== 'Unknown') {
                    const date = LiftLogicDates.parseLocalDate(lastWorkout.date);
                    if (!isNaN(date.getTime())) {
                        formattedDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    }
                }
            } catch (e) {
                console.error('Error formatting date:', e);
            }

            // Build detailed sets info
            const formatLoad = (weight) => (parseFloat(weight) > 0 ? `${weight}lb` : 'BW');

            let setsHtml = '';
            if (suggestion.sets && suggestion.sets.length > 0) {
                setsHtml = suggestion.sets.map((set, idx) => {
                    const weight = parseFloat(set.weight) || 0;
                    const reps = parseInt(set.reps) || 0;
                    return `Set ${idx + 1}: ${formatLoad(weight)} × ${reps}`;
                }).join(' • ');
            }

            hintDiv.innerHTML = `
                <div class="hint-header">
                    Last Workout <span class="hint-date">${formattedDate}</span>
                </div>
                ${setsHtml ? `<div style="font-size: 12px; color: var(--ink-2); margin-bottom: var(--space-1);">
                    ${setsHtml}
                </div>` : ''}
                <div class="hint-data">
                    <div class="hint-item">
                        <span class="hint-label">Previous</span>
                        <span class="hint-value">${formatLoad(suggestion.lastWeight)} × ${suggestion.lastReps}</span>
                    </div>
                    <div class="hint-item">
                        <span class="hint-label">Suggested</span>
                        <span class="hint-suggestion">${formatLoad(suggestion.suggestedWeight)} × ${suggestion.suggestedReps}</span>
                    </div>
                </div>
                <button type="button" class="apply-suggestion-btn" onclick="applySuggestion(${exerciseId}, ${suggestion.suggestedWeight}, ${suggestion.suggestedReps})">
                    Apply Suggestion
                </button>
            `;
            hintDiv.style.display = 'block';
            finishProgress();
        }

        function applySuggestion(exerciseId, weight, reps) {
            const setsContainer = document.getElementById(`sets-${exerciseId}`);

            if (!setsContainer) {
                console.error('Sets container not found for exercise', exerciseId);
                return;
            }

            const setInputs = setsContainer.querySelectorAll('.set-entry');

            if (!setInputs || setInputs.length === 0) {
                console.error('No sets found for exercise', exerciseId);
                return;
            }

            // Validate weight and reps
            const validWeight = parseFloat(weight) || 0;
            const validReps = parseInt(reps) || 0;

            if (validWeight <= 0 && validReps <= 0) {
                console.error('Invalid weight or reps suggestion');
                return;
            }

            setInputs.forEach(setDiv => {
                const weightInput = setDiv.querySelector('.set-weight');
                const repsInput = setDiv.querySelector('.set-reps');

                // Only fill empty fields
                if (weightInput && !weightInput.value && validWeight > 0) {
                    weightInput.value = validWeight;
                }
                if (repsInput && !repsInput.value && validReps > 0) {
                    repsInput.value = validReps;
                }
            });
        }

        function initializeUserProfiles() {
            try {
                const savedProfiles = localStorage.getItem('userProfiles');
                if (savedProfiles) {
                    userProfiles = JSON.parse(savedProfiles);
                }

                if (!userProfiles['default']) {
                    userProfiles['default'] = {
                        id: 'default',
                        name: 'Default User',
                        email: '',
                        createdAt: new Date().toISOString()
                    };
                    saveUserProfiles();
                }

                const savedCurrentUser = localStorage.getItem('currentUser');
                if (savedCurrentUser && userProfiles[savedCurrentUser]) {
                    currentUser = savedCurrentUser;
                }

                updateUserInterface();
                populateUserSelect();
            } catch (e) {
                console.error('Error initializing user profiles:', e);
            }
        }

        function saveUserProfiles() {
            try {
                localStorage.setItem('userProfiles', JSON.stringify(userProfiles));
                localStorage.setItem('currentUser', currentUser);
            } catch (e) {
                console.error('Error saving user profiles:', e);
            }
        }

        function updateUserInterface() {
            const currentUserData = userProfiles[currentUser];
            const avatarEl = document.getElementById('userAvatar');
            if (currentUserData && avatarEl) {
                avatarEl.textContent = currentUserData.name.charAt(0).toUpperCase();
            }
        }

        function populateUserSelect() {
            const select = document.getElementById('userSelect');
            if (!select) return; // legacy profile picker no longer rendered
            select.innerHTML = '';

            Object.values(userProfiles).forEach(user => {
                const option = document.createElement('option');
                option.value = user.id;
                option.textContent = user.name;
                if (user.id === currentUser) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        }

        function switchUser(userId) {
            if (userProfiles[userId]) {
                currentUser = userId;
                saveUserProfiles();
                updateUserInterface();
                showNotification(`Switched to ${userProfiles[userId].name}`, 'success');
                refreshVisibleExerciseProgress();
            }
        }

        // Exercise Management
        let exerciseCount = 0;
        let sessionSavedId = null;
        let sessionFromResume = false;
        let sessionDirty = false;
        let resumeFilling = false;
        let draftTimer = null;

        function addExercise() {
            exerciseCount++;
            const container = document.getElementById('exercises-container');

            const exerciseDiv = document.createElement('div');
            exerciseDiv.className = 'exercise-entry';
            exerciseDiv.dataset.exerciseId = exerciseCount;

            exerciseDiv.innerHTML = `
                <div class="exercise-header">
                    <span class="exercise-number">Exercise ${exerciseCount}</span>
                    <button type="button" class="btn btn-danger btn-icon" onclick="removeExercise(${exerciseCount})" aria-label="Remove exercise"><span class="icon" data-icon="close" aria-hidden="true"></span></button>
                </div>

                <div class="form-group">
                    <label for="exercise-${exerciseCount}">Exercise</label>
                    <input type="text" id="exercise-${exerciseCount}" class="exercise-name" list="exerciseList"
                           placeholder="Start typing..." required aria-required="true"
                           oninput="updateExerciseProgress(${exerciseCount}, false)"
                           onchange="showProgressiveOverloadHint(${exerciseCount})"
                           onblur="showProgressiveOverloadHint(${exerciseCount})">
                    <div id="hint-${exerciseCount}" class="last-workout-hint" style="display: none;"></div>
                </div>

                <div id="progress-${exerciseCount}" class="exercise-progress" hidden></div>

                <div class="sets-container">
                    <label>Sets — Weight × Reps</label>
                    <div class="sets-list" id="sets-${exerciseCount}">
                        <div class="set-entry">
                            <span class="set-label">1</span>
                            <input type="number" class="set-weight" placeholder="lbs" step="0.5" min="0" required aria-label="Weight in pounds">
                            <input type="number" class="set-reps" placeholder="reps" min="1" required aria-label="Number of reps">
                            <button type="button" class="btn btn-danger" onclick="removeSet(this)" aria-label="Remove set">×</button>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 12px;">
                        <button type="button" class="btn btn-secondary" onclick="addSet(${exerciseCount})" style="flex: 1; height: 44px;">
                            + Add Set
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="toggleSetDetails(${exerciseCount})" style="height: 44px; padding: 0 16px;" id="details-toggle-${exerciseCount}">
                            RPE/RIR
                        </button>
                    </div>
                </div>

                <!-- Rest Timer - Immediately after sets -->
                <div class="rest-timer" id="rest-timer-${exerciseCount}">
                    <label>Rest</label>
                    <div class="rest-presets">
                        <button type="button" class="btn-timer" onclick="startRestTimer(${exerciseCount}, 60)">1:00</button>
                        <button type="button" class="btn-timer" onclick="startRestTimer(${exerciseCount}, 90)">1:30</button>
                        <button type="button" class="btn-timer" onclick="startRestTimer(${exerciseCount}, 120)">2:00</button>
                        <button type="button" class="btn-timer" onclick="startRestTimer(${exerciseCount}, 180)">3:00</button>
                    </div>
                    <div class="rest-display" id="rest-display-${exerciseCount}">
                        <div class="rest-time">0:00</div>
                        <div class="rest-controls" style="display: none;">
                            <button type="button" class="btn btn-sm" onclick="pauseRestTimer(${exerciseCount})">Pause</button>
                            <button type="button" class="btn btn-sm" onclick="resetRestTimer(${exerciseCount})">Reset</button>
                        </div>
                    </div>
                </div>

                <!-- Optional: Pump rating (collapsed by default) -->
                <div class="form-group" style="margin-top: 12px;">
                    <label for="pump-${exerciseCount}">Pump (optional)</label>
                    <input type="number" id="pump-${exerciseCount}" class="exercise-pump" placeholder="1-10" min="1" max="10" step="0.5" style="height: 44px;">
                </div>
            `;

            container.appendChild(exerciseDiv);

            // Start workout timer on first exercise
            if (exerciseCount === 1) {
                startWorkoutTimer();
            }

            // Update load button state
            checkLoadButtonState();
        }

        function removeExercise(id) {
            const exercise = document.querySelector(`[data-exercise-id="${id}"]`);
            if (exercise) {
                clearTimeout(progressInputTimers[id]);
                exercise.querySelectorAll('.exercise-progress').forEach(node => {
                    if (window.LiftLogicProgress) LiftLogicProgress.unmount(node);
                });
                // Clear the rest timer for this exercise
                if (restTimers[id]) {
                    if (restTimers[id].interval) {
                        clearInterval(restTimers[id].interval);
                    }
                    delete restTimers[id];
                }
                exercise.remove();
                
                // Update load button state
                checkLoadButtonState();
            }
        }

        function addSet(exerciseId) {
            const setsContainer = document.getElementById(`sets-${exerciseId}`);
            const setNumber = setsContainer.children.length + 1;
            const showDetails = setsContainer.classList.contains('show-details');

            const setDiv = document.createElement('div');
            setDiv.className = 'set-entry';
            setDiv.innerHTML = `
                <span class="set-label">${setNumber}</span>
                <input type="number" class="set-weight" placeholder="lbs" step="0.5" min="0" required aria-label="Weight in pounds">
                <input type="number" class="set-reps" placeholder="reps" min="1" required aria-label="Number of reps">
                <button type="button" class="btn btn-danger" onclick="removeSet(this)" aria-label="Remove set">×</button>
            `;

            // Add RPE/RIR row if details are shown
            if (showDetails) {
                const metricsDiv = document.createElement('div');
                metricsDiv.className = 'set-metrics';
                metricsDiv.innerHTML = `
                    <input type="number" class="set-rpe" placeholder="RPE 1-10" min="1" max="10" step="0.5" aria-label="RPE rating">
                    <input type="number" class="set-rir" placeholder="RIR 0-10" min="0" max="10" aria-label="RIR rating">
                `;
                setDiv.appendChild(metricsDiv);
            }

            setsContainer.appendChild(setDiv);
        }

        function toggleSetDetails(exerciseId) {
            const setsContainer = document.getElementById(`sets-${exerciseId}`);
            const toggleBtn = document.getElementById(`details-toggle-${exerciseId}`);
            const showDetails = !setsContainer.classList.contains('show-details');
            
            setsContainer.classList.toggle('show-details');
            toggleBtn.style.background = showDetails ? 'var(--black)' : '';
            toggleBtn.style.color = showDetails ? 'var(--accent)' : '';

            // Add or remove metrics rows from existing sets
            const sets = setsContainer.querySelectorAll('.set-entry');
            sets.forEach(setDiv => {
                const existingMetrics = setDiv.querySelector('.set-metrics');
                if (showDetails && !existingMetrics) {
                    const metricsDiv = document.createElement('div');
                    metricsDiv.className = 'set-metrics';
                    metricsDiv.style.gridColumn = '1 / -1';
                    metricsDiv.innerHTML = `
                        <input type="number" class="set-rpe" placeholder="RPE 1-10" min="1" max="10" step="0.5">
                        <input type="number" class="set-rir" placeholder="RIR 0-10" min="0" max="10">
                    `;
                    setDiv.appendChild(metricsDiv);
                } else if (!showDetails && existingMetrics) {
                    existingMetrics.remove();
                }
            });
        }

        function removeSet(button) {
            const setEntry = button.closest('.set-entry');
            const setsContainer = setEntry.closest('.sets-list');

            if (setsContainer.children.length > 1) {
                setEntry.remove();
                updateSetNumbers(setsContainer);
            } else {
                showNotification('At least one set required', 'error');
            }
        }

        function updateSetNumbers(setsContainer) {
            Array.from(setsContainer.children).forEach((setDiv, index) => {
                const label = setDiv.querySelector('.set-label');
                if (label) {
                    label.textContent = `${index + 1}`;
                }
            });
        }

        // Same-day session: reload today's lift, and write saves back onto its id.
        function hideResumeNote() {
            const note = document.getElementById('resumeNote');
            if (note) note.hidden = true;
        }

        function showResumeNote(text) {
            const note = document.getElementById('resumeNote');
            if (!note) return;
            note.textContent = text;
            note.hidden = false;
        }

        function setField(id, value) {
            const el = document.getElementById(id);
            if (!el || value == null || value === '') return;
            el.value = value;
        }

        function setRadio(name, value) {
            const input = document.querySelector(`input[name="${name}"][value="${value === 'yes' ? 'yes' : 'no'}"]`);
            if (input) input.checked = true;
        }

        function fillExerciseEntry(exercise) {
            addExercise();
            const entries = document.querySelectorAll('#exercises-container .exercise-entry');
            const entry = entries[entries.length - 1];
            const id = entry.dataset.exerciseId;
            const nameInput = entry.querySelector('.exercise-name');
            if (nameInput) nameInput.value = exercise.kind || '';

            const sets = Array.isArray(exercise.sets) ? exercise.sets : [];
            for (let i = 1; i < sets.length; i++) addSet(id);
            const needsDetails = sets.some(set => set && (set.rpe != null && set.rpe !== '' || set.rir != null && set.rir !== ''));
            if (needsDetails) toggleSetDetails(id);

            entry.querySelectorAll('.set-entry').forEach((row, index) => {
                const set = sets[index];
                if (!set) return;
                const weight = row.querySelector('.set-weight');
                const reps = row.querySelector('.set-reps');
                if (weight && set.weight != null && set.weight !== '') weight.value = set.weight;
                if (reps && set.reps != null && set.reps !== '') reps.value = set.reps;
                const rpe = row.querySelector('.set-rpe');
                const rir = row.querySelector('.set-rir');
                if (rpe && set.rpe != null && set.rpe !== '') rpe.value = set.rpe;
                if (rir && set.rir != null && set.rir !== '') rir.value = set.rir;
            });

            const pump = entry.querySelector('.exercise-pump');
            if (pump && exercise.pump != null && exercise.pump !== '') pump.value = exercise.pump;
            if (nameInput && nameInput.value) showProgressiveOverloadHint(id);
        }

        function fillWorkoutForm(form) {
            resumeFilling = true;
            setField('workoutDate', form.date);
            setField('workoutTime', form.time);
            setField('sleepQuality', form.sleepQuality);
            setField('stressLevel', form.stressLevel);
            setField('bodyWeight', form.bodyWeight);
            setField('muscleSoreness', form.muscleSoreness);
            setRadio('sick', form.sick);
            setRadio('injured', form.injured);

            Object.keys(progressInputTimers).forEach(id => clearTimeout(progressInputTimers[id]));
            if (window.LiftLogicProgress) LiftLogicProgress.unmountAll();
            document.getElementById('exercises-container').innerHTML = '';
            exerciseCount = 0;
            resetWorkoutTimer();

            const exercises = Array.isArray(form.exercises) ? form.exercises : [];
            if (!exercises.length) addExercise();
            exercises.forEach(fillExerciseEntry);

            const elapsed = Number(form.duration) || 0;
            if (elapsed > 0) {
                workoutStartTime = Date.now() - elapsed * 1000;
                if (!workoutDurationInterval) workoutDurationInterval = setInterval(updateWorkoutDuration, 1000);
                updateWorkoutDuration();
            }
            resumeFilling = false;
            checkLoadButtonState();
        }

        function resumeToday() {
            if (typeof LiftLogicSession === 'undefined' || typeof LiftLogicDates === 'undefined') return false;
            const today = LiftLogicDates.localDateStr(new Date());
            const decision = LiftLogicSession.resumeFor(localStorage, currentUser, today);
            if (!decision.source || !decision.form) return false;
            sessionSavedId = decision.savedId;
            sessionFromResume = true;
            sessionDirty = decision.source === 'draft';
            fillWorkoutForm(decision.form);
            showResumeNote(decision.source === 'draft'
                ? "Continuing today's workout — unsaved changes restored"
                : "Continuing today's workout");
            return true;
        }

        function collectDraft() {
            const exercises = [];
            document.querySelectorAll('.exercise-entry').forEach(entry => {
                const kind = entry.querySelector('.exercise-name')?.value.trim() || '';
                const sets = [];
                entry.querySelectorAll('.set-entry').forEach(setEntry => {
                    const weightRaw = setEntry.querySelector('.set-weight')?.value ?? '';
                    const repsRaw = setEntry.querySelector('.set-reps')?.value ?? '';
                    const rpeRaw = setEntry.querySelector('.set-rpe')?.value ?? '';
                    const rirRaw = setEntry.querySelector('.set-rir')?.value ?? '';
                    if (weightRaw === '' && repsRaw === '' && rpeRaw === '' && rirRaw === '') return;
                    sets.push({
                        weight: weightRaw === '' ? null : Number(weightRaw),
                        reps: repsRaw === '' ? null : parseInt(repsRaw, 10),
                        rpe: rpeRaw === '' ? null : Number(rpeRaw),
                        rir: rirRaw === '' ? null : parseInt(rirRaw, 10)
                    });
                });
                const pumpRaw = entry.querySelector('.exercise-pump')?.value ?? '';
                if (!kind && !sets.length && pumpRaw === '') return;
                exercises.push({
                    kind,
                    sets,
                    pump: pumpRaw === '' ? null : Number(pumpRaw)
                });
            });
            return {
                date: document.getElementById('workoutDate').value,
                time: document.getElementById('workoutTime').value,
                sleepQuality: parseInt(document.getElementById('sleepQuality').value, 10),
                stressLevel: parseInt(document.getElementById('stressLevel').value, 10),
                bodyWeight: parseFloat(document.getElementById('bodyWeight').value) || null,
                muscleSoreness: parseInt(document.getElementById('muscleSoreness').value, 10),
                sick: document.querySelector('input[name="sick"]:checked')?.value || 'no',
                injured: document.querySelector('input[name="injured"]:checked')?.value || 'no',
                exercises,
                duration: getWorkoutDuration()
            };
        }

        function persistDraft() {
            if (resumeFilling || !sessionDirty || typeof LiftLogicSession === 'undefined') return;
            const today = LiftLogicDates.localDateStr(new Date());
            const form = collectDraft();
            if (form.date !== today || !LiftLogicSession.hasContent(form)) {
                LiftLogicSession.clearDraft(localStorage, currentUser);
                return;
            }
            LiftLogicSession.writeDraft(localStorage, currentUser, {
                date: today,
                savedId: sessionSavedId,
                updatedAt: Date.now(),
                form
            });
        }

        function scheduleDraft() {
            if (resumeFilling) return;
            sessionDirty = true;
            clearTimeout(draftTimer);
            draftTimer = setTimeout(persistDraft, 400);
        }

        // Form Submission
        function collectWorkoutData() {
            const workoutDate = document.getElementById('workoutDate').value;
            const workoutTime = document.getElementById('workoutTime').value;
            const sleepQuality = parseInt(document.getElementById('sleepQuality').value);
            const stressLevel = parseInt(document.getElementById('stressLevel').value);
            const bodyWeight = parseFloat(document.getElementById('bodyWeight').value) || null;
            const muscleSoreness = parseInt(document.getElementById('muscleSoreness').value);
            const sick = document.querySelector('input[name="sick"]:checked').value;
            const injured = document.querySelector('input[name="injured"]:checked').value;

            const exercises = [];
            const exerciseEntries = document.querySelectorAll('.exercise-entry');

            exerciseEntries.forEach(entry => {
                const exerciseName = entry.querySelector('.exercise-name').value.trim();
                const sets = [];

                entry.querySelectorAll('.set-entry').forEach(setEntry => {
                    const weight = parseFloat(setEntry.querySelector('.set-weight')?.value);
                    const reps = parseInt(setEntry.querySelector('.set-reps')?.value);
                    // RPE/RIR might be in main entry or in .set-metrics child
                    const rpeInput = setEntry.querySelector('.set-rpe') || setEntry.querySelector('.set-metrics .set-rpe');
                    const rirInput = setEntry.querySelector('.set-rir') || setEntry.querySelector('.set-metrics .set-rir');
                    const rpe = parseFloat(rpeInput?.value) || null;
                    const rir = parseInt(rirInput?.value) || null;

                    if (weight >= 0 && reps > 0) {
                        sets.push({
                            weight,
                            reps,
                            rpe,
                            rir
                        });
                    }
                });

                const pump = parseFloat(entry.querySelector('.exercise-pump')?.value) || null;

                if (exerciseName && sets.length > 0) {
                    exercises.push({
                        kind: exerciseName,
                        sets: sets,
                        weight: sets[0].weight,
                        reps: sets[0].reps,
                        pump: pump
                    });
                }
            });

            return {
                date: workoutDate,
                time: workoutTime,
                sleepQuality: sleepQuality,
                stressLevel: stressLevel,
                bodyWeight: bodyWeight,
                muscleSoreness: muscleSoreness,
                sick: sick,
                injured: injured,
                exercises: exercises,
                duration: getWorkoutDuration()
            };
        }

        function saveWorkout(workoutData) {
            try {
                const today = LiftLogicDates.localDateStr(new Date());
                if (typeof LiftLogicSession === 'undefined') {
                    const key = currentUser === 'default' ? 'workouts' : `${currentUser}_workouts`;
                    const workouts = JSON.parse(localStorage.getItem(key) || '[]');
                    workoutData.id = `${workoutData.date}_${Date.now()}`;
                    workoutData.updatedAt = Date.now();
                    workouts.push(workoutData);
                    localStorage.setItem(key, JSON.stringify(workouts));
                } else {
                    if (sessionSavedId && workoutData.date === today) workoutData.id = sessionSavedId;
                    const result = LiftLogicSession.commit(localStorage, currentUser, workoutData, { today, now: Date.now() });
                    workoutData.id = result.record.id;
                    workoutData.updatedAt = result.record.updatedAt;
                    if (result.record.date === today) sessionSavedId = result.record.id;
                    sessionDirty = false;
                    if (result.record.date === today) {
                        sessionFromResume = true;
                        showResumeNote("Continuing today's workout");
                    }
                    if (typeof LiftLogicSync !== 'undefined' && typeof LiftLogicAuth !== 'undefined' && LiftLogicAuth.isSignedIn()) {
                        const uploads = [result.record].concat(result.tombstones || []);
                        uploads.forEach(record => {
                            LiftLogicSync.uploadSingleWorkout(record).then(upload => {
                                if (upload && upload.success && record === result.record) showNotification('Synced to cloud', 'success');
                            });
                        });
                    }
                }
                try { refreshVisibleExerciseProgress(); } catch (err) { console.error(err); }

                showNotification('Workout saved', 'success');

                setTimeout(() => {
                    if (confirm('Start new workout?')) {
                        resetForm();
                    }
                }, 1000);

            } catch (e) {
                console.error('Error saving workout:', e);
                showNotification('Save failed', 'error');
            }
        }

        function resetForm() {
            document.getElementById('workoutForm').reset();
            Object.keys(progressInputTimers).forEach(id => clearTimeout(progressInputTimers[id]));
            if (window.LiftLogicProgress) LiftLogicProgress.unmountAll();
            document.getElementById('exercises-container').innerHTML = '';
            exerciseCount = 0;
            resetWorkoutTimer();

            // Clear all rest timers
            Object.keys(restTimers).forEach(id => {
                if (restTimers[id].interval) {
                    clearInterval(restTimers[id].interval);
                }
                delete restTimers[id];
            });

            setCurrentDateTime();
            addExercise();
            sessionSavedId = null;
            sessionFromResume = false;
            sessionDirty = false;
            hideResumeNote();
            if (typeof LiftLogicSession !== 'undefined') LiftLogicSession.clearDraft(localStorage, currentUser);

            // Update load button state (will be disabled now since addExercise adds empty exercise)
            checkLoadButtonState();
        }

        // Notification System
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';

            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // Set current date and time
        function setCurrentDateTime() {
            const now = new Date();
            const dateStr = LiftLogicDates.localDateStr(now);
            const timeStr = now.toTimeString().slice(0, 5);

            document.getElementById('workoutDate').value = dateStr;
            document.getElementById('workoutTime').value = timeStr;
        }

        // Populate exercise datalist
        function populateExerciseList() {
            const datalist = document.getElementById('exerciseList');
            // Prefer the shared catalog (js/data/exercises.js) + the user's custom exercises
            let names = masterExerciseList;
            if (typeof ExerciseDB !== 'undefined') {
                const custom = Object.values(ExerciseDB.getCustomExercises()).map(c => c.name).filter(Boolean);
                names = [...new Set([...ExerciseDB.getAllExercises(), ...custom])].sort((a, b) => a.localeCompare(b));
            }
            names.forEach(exercise => {
                const option = document.createElement('option');
                option.value = exercise;
                datalist.appendChild(option);
            });
        }

        // Load Workout - Select any day's workout
        function initializeLoadWorkout() {
            if (typeof SCHEDULE_DATA === 'undefined') {
                console.warn('SCHEDULE_DATA not loaded');
                return;
            }

            const daySelector = document.getElementById('daySelector');
            if (!daySelector) return;

            // Get today's day index
            const today = new Date();
            const dayOfWeek = today.getDay(); // 0 = Sunday, 1 = Monday, etc.
            const dayMapping = { 0: 6, 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5 }; // JS day to schedule index
            const todayIndex = dayMapping[dayOfWeek];

            // Populate dropdown with all days
            daySelector.innerHTML = '';
            SCHEDULE_DATA.days.forEach((day, index) => {
                const option = document.createElement('option');
                option.value = index;
                
                const isToday = index === todayIndex;
                const todayLabel = isToday ? ' (Today)' : '';
                
                if (day.isRest) {
                    option.textContent = `${day.name} — ${day.focus}${todayLabel}`;
                    option.disabled = true;
                } else {
                    option.textContent = `${day.name} — ${day.focus}${todayLabel}`;
                }
                
                // Select today by default (or first workout day if today is rest)
                if (isToday && !day.isRest) {
                    option.selected = true;
                }
                
                daySelector.appendChild(option);
            });

            // If today is a rest day, select the first workout day
            const selectedOption = daySelector.querySelector('option:checked');
            if (!selectedOption || selectedOption.disabled) {
                const firstWorkoutDay = daySelector.querySelector('option:not(:disabled)');
                if (firstWorkoutDay) {
                    firstWorkoutDay.selected = true;
                }
            }

            // Update preview and button state
            updateLoadPreview();
        }

        function updateLoadPreview() {
            if (typeof SCHEDULE_DATA === 'undefined') return;

            const daySelector = document.getElementById('daySelector');
            const previewExercises = document.getElementById('loadPreviewExercises');
            const previewMessage = document.getElementById('loadPreviewMessage');
            const loadBtn = document.getElementById('loadWorkoutBtn');

            const selectedIndex = parseInt(daySelector.value);
            const selectedDay = SCHEDULE_DATA.days[selectedIndex];

            if (!selectedDay || selectedDay.isRest) {
                previewExercises.innerHTML = '<span class="quick-start-exercise-tag"><span class="icon icon--sm" data-icon="rest" aria-hidden="true"></span> Rest Day</span>';
                previewMessage.textContent = '';
                loadBtn.disabled = true;
                return;
            }

            // Show exercise preview
            previewExercises.innerHTML = selectedDay.exercises.map(ex => 
                `<span class="quick-start-exercise-tag">${ex.name}</span>`
            ).join('');

            // Check if session already has exercises
            const existingExercises = document.querySelectorAll('#exercises-container .exercise-entry');
            const hasExistingData = existingExercises.length > 0 && 
                Array.from(existingExercises).some(entry => {
                    const nameInput = entry.querySelector('.exercise-name');
                    return nameInput && nameInput.value.trim() !== '';
                });

            if (LiftLogicSession.loadIsBlocked(hasExistingData, sessionFromResume)) {
                previewMessage.textContent = 'Session not empty — clear exercises first';
                previewMessage.className = 'load-preview-message error';
                loadBtn.disabled = true;
            } else {
                previewMessage.textContent = `${selectedDay.exercises.length} exercises ready to load`;
                previewMessage.className = 'load-preview-message';
                loadBtn.disabled = false;
            }
        }

        function loadWorkoutFromSchedule() {
            if (typeof SCHEDULE_DATA === 'undefined') return;

            const daySelector = document.getElementById('daySelector');
            const selectedIndex = parseInt(daySelector.value);
            const selectedDay = SCHEDULE_DATA.days[selectedIndex];

            if (!selectedDay || selectedDay.isRest) {
                showNotification('Cannot load rest day', 'error');
                return;
            }

            // Double-check session is empty
            const container = document.getElementById('exercises-container');
            const existingExercises = container.querySelectorAll('.exercise-entry');
            const hasExistingData = existingExercises.length > 0 && 
                Array.from(existingExercises).some(entry => {
                    const nameInput = entry.querySelector('.exercise-name');
                    return nameInput && nameInput.value.trim() !== '';
                });

            if (LiftLogicSession.loadIsBlocked(hasExistingData, sessionFromResume)) {
                showNotification('Clear existing exercises first', 'error');
                return;
            }
            if (hasExistingData && sessionFromResume && sessionDirty) {
                if (!confirm("Replace today's exercises with this day?")) return;
            }
            sessionFromResume = false;
            hideResumeNote();

            // Clear container
            container.innerHTML = '';
            exerciseCount = 0;

            // Add each exercise from the selected day's schedule
            selectedDay.exercises.forEach((ex) => {
                addExercise();
                
                // Get the just-added exercise entry
                const entries = container.querySelectorAll('.exercise-entry');
                const entry = entries[entries.length - 1];
                
                // Set the exercise name
                const nameInput = entry.querySelector('.exercise-name');
                if (nameInput) {
                    nameInput.value = ex.name;
                    // Trigger progressive overload hint lookup
                    showProgressiveOverloadHint(exerciseCount);
                }

                // Parse sets from schedule (e.g., "4 × 6-10" -> 4 sets)
                const setsMatch = ex.sets.match(/^(\d+)/);
                const numSets = setsMatch ? parseInt(setsMatch[1]) : 3;
                
                // Add the required number of sets (first one is already added)
                const setsContainer = entry.querySelector('.sets-list');
                for (let i = 1; i < numSets; i++) {
                    addSet(exerciseCount);
                }
            });

            // Scroll to the first exercise
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            // Update the preview to show "not empty" now
            updateLoadPreview();
            
            sessionDirty = true;
            persistDraft();
            showNotification(`Loaded ${selectedDay.exercises.length} exercises for ${selectedDay.focus}`, 'success');
        }

        // Re-check load button state when exercises change
        function checkLoadButtonState() {
            // Only update if the load workout UI is initialized
            if (document.getElementById('daySelector')?.options?.length > 0) {
                updateLoadPreview();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            initializeUserProfiles();

            // User selection removed - now using Firebase Auth
            const userSelect = document.getElementById('userSelect');
            if (userSelect) {
                userSelect.addEventListener('change', (e) => {
                    switchUser(e.target.value);
                });
            }

            setCurrentDateTime();
            populateExerciseList();
            let resumed = false;
            try { resumed = resumeToday(); } catch (err) { console.error(err); }
            if (!resumed) addExercise();

            // Initialize load workout selector after schedule data is loaded
            setTimeout(initializeLoadWorkout, 100);

            const workoutForm = document.getElementById('workoutForm');
            workoutForm.addEventListener('input', scheduleDraft);
            workoutForm.addEventListener('change', scheduleDraft);
            window.addEventListener('pagehide', persistDraft);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') persistDraft();
            });

            workoutForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const exerciseEntries = document.querySelectorAll('.exercise-entry');
                if (exerciseEntries.length === 0) {
                    showNotification('Add at least one exercise', 'error');
                    return;
                }

                const workoutData = collectWorkoutData();

                if (workoutData.exercises.length === 0) {
                    showNotification('Add exercises with sets', 'error');
                    return;
                }

                saveWorkout(workoutData);
            });
        });

        // Schedule Modal Functions
        function openScheduleModal() {
            const modal = document.getElementById('scheduleModal');
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeScheduleModal() {
            const modal = document.getElementById('scheduleModal');
            modal.classList.remove('open');
            document.body.style.overflow = '';
        }

        // Close modal on outside click
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('scheduleModal');
            if (e.target === modal) {
                closeScheduleModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeScheduleModal();
            }
        });

        // Data Health Check
        function checkDataHealth() {
            try {
                const workoutsKey = currentUser === 'default' ? 'workouts' : `${currentUser}_workouts`;
                const workouts = JSON.parse(localStorage.getItem(workoutsKey) || '[]');

                let issueCount = 0;

                workouts.forEach(workout => {
                    // Bike rides have no exercises by design
                    if (workout && workout.type === 'ride') return;

                    // Check for missing dates
                    if (!workout.date && !workout.dailyInfo?.currentDate) {
                        issueCount++;
                    }

                    // Check for missing exercises
                    if (!workout.exercises || workout.exercises.length === 0) {
                        issueCount++;
                    }
                });

                const badge = document.getElementById('dataHealthBadge');
                if (issueCount > 0) {
                    badge.textContent = issueCount > 9 ? '9+' : issueCount;
                    badge.style.display = 'inline-flex';
                    badge.title = `${issueCount} data issue${issueCount > 1 ? 's' : ''} found`;
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) {
                console.error('Error checking data health:', e);
            }
        }

        // Another tab saved or deleted a workout for this profile.
        window.addEventListener('storage', (event) => {
            const mine = currentUser === 'default' ? 'workouts' : `${currentUser}_workouts`;
            if (!event.key || event.key === mine || event.key === 'currentUser') {
                refreshVisibleExerciseProgress();
            }
        });

        // Run data health check on load
        checkDataHealth();
    </script>
